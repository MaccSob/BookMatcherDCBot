<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Book Matcher — test</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 0 20px;
    background: #111;
    color: #eee;
  }
  h1 { font-size: 1.4rem; }
  textarea {
    width: 100%;
    height: 80px;
    font-size: 1rem;
    padding: 10px;
    box-sizing: border-box;
    background: #1e1e1e;
    color: #eee;
    border: 1px solid #444;
    border-radius: 6px;
  }
  button {
    margin-top: 10px;
    padding: 10px 20px;
    font-size: 1rem;
    cursor: pointer;
    background: #4a7fff;
    color: white;
    border: none;
    border-radius: 6px;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  .book {
    margin-top: 20px;
    padding: 14px;
    background: #1e1e1e;
    border-radius: 8px;
  }
  .book h3 { margin: 0 0 2px 0; }
  .book .author { margin: 0 0 8px 0; color: #999; font-size: 0.9rem; font-style: italic; }
  .book p { margin: 0; color: #ccc; }
  #status { margin-top: 10px; color: #999; }
</style>
</head>
<body>

<h1>📚 Book Matcher</h1>
<p>Opisz swój obecny nastrój czytelniczy:</p>

<textarea id="mood" placeholder="np. coś lekkiego przed snem, max 30 min czytania"></textarea>
<br>
<button id="submit">Szukaj rekomendacji</button>

<div id="status"></div>
<div id="results"></div>

<script>
const API_URL = "http://127.0.0.1:8000/recommend";

document.getElementById("submit").addEventListener("click", async () => {
  const mood = document.getElementById("mood").value.trim();
  const statusEl = document.getElementById("status");
  const resultsEl = document.getElementById("results");
  const button = document.getElementById("submit");

  if (!mood) {
    statusEl.textContent = "Wpisz jakiś opis nastroju.";
    return;
  }

  button.disabled = true;
  statusEl.textContent = "Szukam... (to może potrwać do minuty)";
  resultsEl.innerHTML = "";

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mood: mood })
    });

    if (!response.ok) {
      throw new Error(`Serwer odpowiedział błędem: ${response.status}`);
    }

    const books = await response.json();
    statusEl.textContent = "";

    books.forEach(book => {
      const div = document.createElement("div");
      div.className = "book";

      // author może przyjść jako lista (["Imię Nazwisko", ...]) albo pojedynczy string
      let authorText = "Nieznany autor";
      if (Array.isArray(book.author)) {
        authorText = book.author.join(", ");
      } else if (book.author) {
        authorText = book.author;
      }

      div.innerHTML = `
        <h3>${book.title}</h3>
        <p class="author">${authorText}</p>
        <p>${book.reasoning}</p>
      `;
      resultsEl.appendChild(div);
    });

  } catch (err) {
    statusEl.textContent = "Błąd: " + err.message + " (czy serwer api.py jest uruchomiony?)";
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
</html>
